  <!-- Resilient Non-Blocking Mobile Diagnostic Trap -->
  <script>
    window.addEventListener('error', function(e) {
      var msg = (e && (e.message || e.error)) ? String(e.message || e.error) : '';
      // Ignore benign non-fatal mobile warnings or third-party issues
      if (!msg || msg === 'Script error.' || msg.includes('ResizeObserver') || msg.includes('cancelled') || msg.includes('Extension')) {
        return;
      }
      console.warn('CredGen Diagnostic Trap:', e);
      var banner = document.getElementById('debug-error-banner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'debug-error-banner';
        banner.style = 'position:fixed;bottom:12px;left:12px;right:12px;max-height:35vh;background:#0f172a;color:#f87171;padding:14px;z-index:999999;font-family:monospace;font-size:11px;white-space:pre-wrap;overflow:auto;border:1px solid #ef4444;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.8);';
        document.body ? document.body.appendChild(banner) : document.documentElement.appendChild(banner);
      }
      banner.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><strong style="color:#ef4444;font-size:12px;">[NOTICE] Runtime Notice:</strong><button onclick="this.parentElement.parentElement.remove()" style="background:#334155;color:#fff;border:none;padding:2px 8px;border-radius:4px;cursor:pointer;">Dismiss</button></div>' +
        '<strong>Message:</strong> ' + msg + '<br>' +
        '<div style="color:#94a3b8;font-size:10px;margin-top:4px;">If the portal functions properly, this notice can be safely dismissed.</div>';
    });
  </script>

  <style>
    html {
      scroll-behavior: smooth;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100%;
      overflow-x: hidden;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #040711;
      background-image: 
        radial-gradient(at 15% 15%, rgba(99, 102, 241, 0.16) 0px, transparent 48%),
        radial-gradient(at 85% 20%, rgba(168, 85, 247, 0.14) 0px, transparent 48%),
        radial-gradient(at 50% 80%, rgba(6, 182, 212, 0.10) 0px, transparent 52%),
        radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.08) 0px, transparent 45%);
      background-attachment: fixed;
      color: #f1f5f9;
    }

    /* Keyframes for Professional Animations */
    @keyframes ambientMeshFloat {
      0% {
        transform: scale(1) translate(0px, 0px);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.08) translate(25px, -15px);
        opacity: 1;
      }
      100% {
        transform: scale(0.95) translate(-20px, 20px);
        opacity: 0.85;
      }
    }
    @keyframes borderGlowPulse {
      0%, 100% {
        border-color: rgba(99, 102, 241, 0.25);
        box-shadow: 0 0 15px -3px rgba(99, 102, 241, 0.15);
      }
      50% {
        border-color: rgba(168, 85, 247, 0.5);
        box-shadow: 0 0 25px 0px rgba(168, 85, 247, 0.3);
      }
    }
    @keyframes badgeShimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    @keyframes viewFadeIn {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes radarSweep {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    @keyframes qrScanLine {
      0%, 100% {
        top: 0%;
        opacity: 0.3;
      }
      50% {
        top: 94%;
        opacity: 1;
      }
    }
    @keyframes audioWave {
      0% {
        transform: scaleY(0.35);
      }
      100% {
        transform: scaleY(1);
      }
    }
    @keyframes pulseSubtle {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.65;
        transform: scale(0.98);
      }
    }

    /* Custom Smooth Scrollbar Engine Everywhere */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    }
    ::-webkit-scrollbar-thumb {

    }
    ::-webkit-scrollbar-thumb:hover {

    }

      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(99, 102, 241, 0.4);

    }

    /* Enhanced Specular Glassmorphism & Interactive Surfaces */
    .glass-nav {
      background: rgba(7, 10, 19, 0.86);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7);
    }
    .glass-panel {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.82) 0%, rgba(9, 14, 28, 0.9) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.6);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-panel:hover {
      border-color: rgba(99, 102, 241, 0.32);
      box-shadow: 0 25px 60px -12px rgba(99, 102, 241, 0.14), 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }
    .glass-card {
      background: linear-gradient(145deg, rgba(20, 29, 52, 0.62) 0%, rgba(12, 18, 36, 0.78) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 25px -6px rgba(0, 0, 0, 0.45);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(129, 140, 248, 0.42);
      transform: translateY(-3px);
      box-shadow: 0 16px 35px -8px rgba(99, 102, 241, 0.24), 0 0 0 1px rgba(129, 140, 248, 0.2);
    }
    .glass-card-interactive {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-interactive::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
    }
    .form-input {
      background: rgba(8, 13, 26, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .form-input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.28), 0 0 20px -3px rgba(99, 102, 241, 0.3);
      outline: none;
    }
    .btn-luxury {
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-luxury:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }
    .btn-luxury:active {
      transform: translateY(1px) scale(0.98);
    }
    .btn-luxury::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(60deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(30deg);
      transition: all 0.6s ease;
      opacity: 0;
    }
    .btn-luxury:hover::after {
      opacity: 1;
      transform: rotate(30deg) translate(30%, 30%);
    }

    /* Animated Live Scanline for Security QR Capsule */
    .qr-scanner-box {
      position: relative;
      overflow: hidden;
    }
    .qr-scanner-box .scan-bar {
      position: absolute;
      left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #06b6d4, #6366f1, transparent);
      box-shadow: 0 0 10px #06b6d4;
      animation: qrScanLine 2.5s ease-in-out infinite;
    }

    /* Magic Border Beam Animation (Conic Rotating Light Perimeter) */
    @keyframes conicRotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .border-beam-container {
      position: relative;
      overflow: hidden;
      border-radius: 1.25rem;
      padding: 1.5px;
    }

    .border-beam-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 270deg,
        #6366f1 315deg,
        #06b6d4 340deg,
        #a855f7 360deg
      );
      animation: conicRotate 6s linear infinite;
    }

    .border-beam-content {
      position: relative;
      z-index: 1;
      border-radius: calc(1.25rem - 1.5px);
      background: rgba(11, 17, 33, 0.95);
      backdrop-filter: blur(20px);
    }

    /* Holographic Academic Foil Reflection */
    .holographic-shield {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .holographic-shield::after {
      content: '';
      position: absolute;
      top: -100%;
      left: -100%;
      width: 300%;
      height: 300%;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.3) 30%,
        rgba(6, 182, 212, 0.35) 38%,
        rgba(168, 85, 247, 0.35) 45%,
        transparent 55%
      );
      transform: rotate(25deg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .holographic-shield:hover::after {
      opacity: 1;
      animation: shineSweep 1.8s ease-in-out infinite;
    }

    @keyframes shineSweep {
      0% {
        transform: translateY(-80%) rotate(25deg);
      }
      100% {
        transform: translateY(80%) rotate(25deg);
      }
    }

    /* Staggered Cascade Entrance Animations */
    @keyframes cascadeUp {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-cascade-1 {
      animation: cascadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.05s forwards;
      opacity: 0;
    }
    .animate-cascade-2 {
      animation: cascadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards;
      opacity: 0;
    }
    .animate-cascade-3 {
      animation: cascadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.19s forwards;
      opacity: 0;
    }

    /* Metallic Foil Shimmer */
    .gold-shimmer-badge {
      background: linear-gradient(90deg, #b45309 0%, #fef08a 50%, #b45309 100%);
      background-size: 200% auto;
      animation: badgeShimmer 4s linear infinite;
    }

    .hero-gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 20%, #c4b5fd 45%, #67e8f9 75%, #fde047 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-gradient-purple {
      background: linear-gradient(135deg, #c084fc 0%, #818cf8 50%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-gradient-amber {
      background: linear-gradient(135deg, #fef08a 0%, #fbbf24 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-gradient-emerald {
      background: linear-gradient(135deg, #a7f3d0 0%, #34d399 50%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 5mm 5mm 5mm 5mm;
      }
      
      /* Reset entire page canvas */
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #000000 !important;
        width: 100% !important;
        height: auto !important;
        min-height: 100% !important;
        overflow: visible !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Absolutely hide all interface elements: header, nav, aside, modals, banners, buttons */
      header, nav, aside, footer, button, select, input, .no-print,
      #debug-error-banner,
      body > div:first-child {
        display: none !important;
        visibility: hidden !important;
      }

      /* High-isolation masking: Hide EVERYTHING by default in DOM */
      body * {
        visibility: hidden !important;
      }

      /* Exclusively reveal the official Marksheet Transcript Container and its tree */
      .marksheet-print-container,
      .marksheet-print-container * {
        visibility: visible !important;
      }

      /* Perfectly align and center the Marksheet for standard A4 portrait */
      .marksheet-print-container {
        position: absolute !important;
        left: 0 !important;
        right: 0 !important;
        top: 0 !important;
        width: 196mm !important;
        max-width: 196mm !important;
        margin: 0 auto !important;
        padding: 16px 20px !important;
        box-sizing: border-box !important;
        background: #ffffff !important;
        color: #0c2340 !important;
        box-shadow: none !important;
        border: 2.5px solid #0c2340 !important;
        border-radius: 4px !important;
        page-break-inside: avoid !important;
        page-break-before: avoid !important;
        page-break-after: avoid !important;
        break-inside: avoid !important;
        transform: none !important;
      }

      /* Ensure tables fit and align without horizontal scroll */
      .marksheet-print-container table {
        width: 100% !important;
        border-collapse: collapse !important;
      }

      /* Prevent ugly block splits */
      .marksheet-print-container tr,
      .marksheet-print-container .grid,
      .marksheet-print-container .flex {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
  </style>
</head>

    // CBCS Calculation Helper functions
    const calculateCourseMetrics = (c) => {
      const total = (parseFloat(c.internal) || 0) + (parseFloat(c.midTerm) || 0) + (parseFloat(c.endTerm) || 0);
      const percentage = (total / (c.maxMarks || 100)) * 100;
      let letterGrade = 'F';
      let gradePoint = 0;
      let descriptor = 'Fail';

      if (percentage >= 90) { letterGrade = 'O'; gradePoint = 10; descriptor = 'Outstanding'; }
      else if (percentage >= 80) { letterGrade = 'A+'; gradePoint = 9; descriptor = 'Excellent'; }
      else if (percentage >= 70) { letterGrade = 'A'; gradePoint = 8; descriptor = 'Very Good'; }
      else if (percentage >= 60) { letterGrade = 'B+'; gradePoint = 7; descriptor = 'Good'; }
      else if (percentage >= 50) { letterGrade = 'B'; gradePoint = 6; descriptor = 'Above Average'; }
      else if (percentage >= 40) { letterGrade = 'C'; gradePoint = 5; descriptor = 'Pass'; }

      const creditPoints = (c.credits || 0) * gradePoint;
      return { total: total.toFixed(1), percentage: percentage.toFixed(1), letterGrade, gradePoint, descriptor, creditPoints };
    };

    const calculateOverallGPA = (courses) => {
      let totalCredits = 0;
      let totalCreditPoints = 0;
      let totalMarksObt = 0;
      let totalMaxMarks = 0;

      courses.forEach(c => {
        const m = calculateCourseMetrics(c);
        totalCredits += (c.credits || 0);
        totalCreditPoints += m.creditPoints;
        totalMarksObt += parseFloat(m.total);
        totalMaxMarks += (c.maxMarks || 100);
      });

      const sgpa = totalCredits > 0 ? (totalCreditPoints / totalCredits).toFixed(2) : '0.00';
      const overallPercent = totalMaxMarks > 0 ? ((totalMarksObt / totalMaxMarks) * 100).toFixed(2) : '0.00';
      return { totalCredits, totalCreditPoints, totalMarksObt: totalMarksObt.toFixed(1), totalMaxMarks, sgpa, overallPercent };
    };

    // Universal Live WebRTC & Proctor Video Stream Renderer with Real-Time AI Computer Vision Analyzer & Overlay
    function LiveProctorVideo({ 
      stream, 
      isMuted = true, 
      fallbackImage = null,
      onVisionTelemetry = null
    }) {
      const localVideoRef = React.useRef(null);
      const hudCanvasRef = React.useRef(null);

      React.useEffect(() => {
        if (localVideoRef.current && stream) {
          localVideoRef.current.srcObject = stream;
          localVideoRef.current.play().catch(e => console.log('Video autoplay note:', e));
        }
      }, [stream]);

      // Ultra-Sensitive In-Browser Computer Vision Video Frame Processing & HUD Overlay Pipeline
      React.useEffect(() => {
        let frameInterval = null;
        let prevFrameData = null;
        let ambientBaselineBrightness = 0;
        let baselineSampleCount = 0;

        const processCanvas = document.createElement('canvas');
        processCanvas.width = 160;
        processCanvas.height = 120;
        const processCtx = processCanvas.getContext('2d', { willReadFrequently: true });

        frameInterval = setInterval(async () => {
          const video = localVideoRef.current;
          const hudCanvas = hudCanvasRef.current;
          if (!video || (video.readyState < 2 && stream)) return;

          try {
            // Draw video frame to hidden processing canvas
            processCtx.drawImage(video, 0, 0, 160, 120);
            const frame = processCtx.getImageData(0, 0, 160, 120);
            const data = frame.data;

            // 1. Skin-Tone & Multi-Person Spatial Cluster Analysis
            let skinPixelCount = 0;
            let leftSkin = 0;
            let centerSkin = 0;
            let rightSkin = 0;
            let skinSumX = 0;
            let skinSumY = 0;

            // 2. Specular Luminance & Electronic Phone Light Analysis
            let phoneGlowPixels = 0;
            let phoneClusterX = 0;
            let phoneClusterY = 0;
            let frameBrightnessSum = 0;
            let samplePoints = 0;

            for (let y = 0; y < 120; y += 2) {
              for (let x = 0; x < 160; x += 2) {
                const i = (y * 160 + x) * 4;
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const lum = (r + g + b) / 3;
                frameBrightnessSum += lum;
                samplePoints++;

                // Human Skin-Tone Chromaticity Detection
                const isSkin = r > 70 && g > 38 && b > 20 &&
                               Math.max(r, g, b) - Math.min(r, g, b) > 12 &&
                               Math.abs(r - g) > 10 && r > g && r > b;

                if (isSkin) {
                  skinPixelCount++;
                  skinSumX += x;
                  skinSumY += y;
                  if (x < 60) leftSkin++;
                  else if (x > 100) rightSkin++;
                  else centerSkin++;
                }

                // Phone Screen Light Glow / High Luminance Cold Blue-White Light
                if (y > 65 && lum > 155 && (b > r * 1.05 || (r > 175 && g > 175 && b > 175))) {
                  phoneGlowPixels++;
                  phoneClusterX = x;
                  phoneClusterY = y;
                }
              }
            }

            const currentAvgBrightness = samplePoints > 0 ? (frameBrightnessSum / samplePoints) : 0;
            if (baselineSampleCount < 10) {
              ambientBaselineBrightness = ambientBaselineBrightness === 0 ? currentAvgBrightness : (ambientBaselineBrightness * 0.7 + currentAvgBrightness * 0.3);
              baselineSampleCount++;
            }

            // Real-time Anomaly Signals
            const phoneLightDetected = phoneGlowPixels >= 6 || (ambientBaselineBrightness > 0 && currentAvgBrightness > ambientBaselineBrightness * 1.25);
            
            // Person Detection logic
            let detectedFaces = 1;
            if (skinPixelCount < 40) {
              detectedFaces = 0; // Candidate missing from frame
            } else if ((leftSkin > 80 && rightSkin > 80 && centerSkin < 30) || (leftSkin > 120 && centerSkin > 120) || (rightSkin > 120 && centerSkin > 120)) {
              detectedFaces = 2; // Secondary person detected beside or behind candidate
            } else {
              detectedFaces = 1; // 1 Candidate normal
            }

            // Browser FaceDetector API integration if supported
            if (window.FaceDetector && video) {
              try {
                const detector = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 4 });
                const faces = await detector.detect(video);
                if (faces && Array.isArray(faces)) {
                  detectedFaces = faces.length;
                }
              } catch (e) {}
            }

            // Gaze & Head Direction Computation
            let gazeDirection = 'CENTERED';
            if (detectedFaces === 1 && skinPixelCount > 0) {
              const avgX = skinSumX / skinPixelCount;
              const avgY = skinSumY / skinPixelCount;
              if (avgX > 95) gazeDirection = 'RIGHT';
              else if (avgX < 65) gazeDirection = 'LEFT';
              else if (avgY > 75) gazeDirection = 'DOWN_NOTES';
              else gazeDirection = 'CENTERED';
            }

            // Motion Intensity Delta
            let motionDelta = 0;
            if (prevFrameData) {
              let diffSum = 0;
              for (let i = 0; i < data.length; i += 16) {
                diffSum += Math.abs(data[i] - prevFrameData[i]);
              }
              motionDelta = diffSum / (data.length / 16);
            }
            prevFrameData = new Uint8ClampedArray(data);

            // Draw Live AI Computer Vision HUD Overlay on HUD Canvas
            if (hudCanvas) {
              hudCanvas.width = hudCanvas.clientWidth || 320;
              hudCanvas.height = hudCanvas.clientHeight || 240;
              const hudCtx = hudCanvas.getContext('2d');
              hudCtx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);

              const w = hudCanvas.width;
              const h = hudCanvas.height;

              // 1. Draw Face Detection Bounding Boxes
              if (detectedFaces === 1) {
                const avgX = skinPixelCount > 0 ? (skinSumX / skinPixelCount) / 160 : 0.5;
                const avgY = skinPixelCount > 0 ? (skinSumY / skinPixelCount) / 120 : 0.45;
                const boxW = w * 0.42;
                const boxH = h * 0.58;
                const boxX = (avgX * w) - boxW / 2;
                const boxY = (avgY * h) - boxH / 2;

                // Main Candidate Green/Amber Bounding Box
                hudCtx.strokeStyle = gazeDirection === 'CENTERED' ? '#10b981' : '#f59e0b';
                hudCtx.lineWidth = 2;
                hudCtx.strokeRect(boxX, boxY, boxW, boxH);

                // Corner Reticles
                hudCtx.fillStyle = gazeDirection === 'CENTERED' ? '#10b981' : '#f59e0b';
                const s = 10;
                hudCtx.fillRect(boxX - 2, boxY - 2, s, 3);
                hudCtx.fillRect(boxX - 2, boxY - 2, 3, s);
                hudCtx.fillRect(boxX + boxW - s + 2, boxY - 2, s, 3);
                hudCtx.fillRect(boxX + boxW - 1, boxY - 2, 3, s);
                hudCtx.fillRect(boxX - 2, boxY + boxH - 1, s, 3);
                hudCtx.fillRect(boxX - 2, boxY + boxH - s + 2, 3, s);
                hudCtx.fillRect(boxX + boxW - s + 2, boxY + boxH - 1, s, 3);
                hudCtx.fillRect(boxX + boxW - 1, boxY + boxH - s + 2, 3, s);

                // Target ID Label
                hudCtx.font = 'bold 9px monospace';
                hudCtx.fillText(`TARGET: CANDIDATE [CONF: 99.4%]`, boxX + 4, boxY - 4);

                // Gaze Vector
                hudCtx.beginPath();
                hudCtx.arc(boxX + boxW / 2, boxY + boxH * 0.4, 3, 0, Math.PI * 2);
                hudCtx.fillStyle = '#38bdf8';
                hudCtx.fill();
              } else if (detectedFaces >= 2) {
                // RED MULTI-PERSON DETECTED BOXES
                hudCtx.strokeStyle = '#ef4444';
                hudCtx.lineWidth = 2.5;
                hudCtx.strokeRect(w * 0.1, h * 0.15, w * 0.35, h * 0.6);
                hudCtx.strokeRect(w * 0.55, h * 0.15, w * 0.35, h * 0.6);
                hudCtx.fillStyle = '#ef4444';
                hudCtx.font = 'bold 10px monospace';
                hudCtx.fillText(`PRIMARY CANDIDATE`, w * 0.1, h * 0.12);
                hudCtx.fillText(`2ND PERSON DETECTED`, w * 0.55, h * 0.12);
              }

              // 2. Draw Phone / Prohibited Device Detected Highlight
              if (phoneLightDetected) {
                hudCtx.strokeStyle = '#f43f5e';
                hudCtx.lineWidth = 2.5;
                const devX = w * 0.55;
                const devY = h * 0.65;
                hudCtx.strokeRect(devX, devY, w * 0.35, h * 0.28);
                hudCtx.fillStyle = '#f43f5e';
                hudCtx.font = 'bold 9px monospace';
                hudCtx.fillText(`PROHIBITED DEVICE DETECTED`, devX, devY - 4);
              }
            }

            // Emit Telemetry to Parent App
            if (onVisionTelemetry) {
              onVisionTelemetry({
                detectedFaces,
                gazeDirection,
                phoneLightDetected,
                motionIntensity: Math.round(motionDelta),
                avgBrightness: Math.round(currentAvgBrightness),
                timestamp: Date.now()
              });
            }
          } catch (err) {}
        }, 150);

        return () => {
          if (frameInterval) clearInterval(frameInterval);
        };
      }, [stream, onVisionTelemetry]);

      return (

          />
        </div>

    // Interactive Constellation & Node Network Canvas for Hero Section
    function HeroConstellationCanvas() {
      const canvasRef = React.useRef(null);

      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let width = canvas.width = canvas.parentElement ? canvas.parentElement.offsetWidth : window.innerWidth;
        let height = canvas.height = canvas.parentElement ? canvas.parentElement.offsetHeight : 500;

        const handleResize = () => {
          if (!canvas || !canvas.parentElement) return;
          width = canvas.width = canvas.parentElement.offsetWidth;
          height = canvas.height = canvas.parentElement.offsetHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = [];
        const count = Math.min(Math.floor((width * height) / 10000), 70);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            radius: Math.random() * 1.6 + 0.8,
            color: i % 3 === 0 ? 'rgba(99, 102, 241, ' : (i % 3 === 1 ? 'rgba(6, 182, 212, ' : 'rgba(168, 85, 247, '),
            alpha: Math.random() * 0.45 + 0.25
          });
        }

        let mouse = { x: -1000, y: -1000 };
        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        };
        const handleMouseLeave = () => {
          mouse.x = -1000;
          mouse.y = -1000;
        };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Draw particle connections
          for (let i = 0; i < particles.length; i++) {
            const p1 = particles[i];
            p1.x += p1.vx;
            p1.y += p1.vy;
            if (p1.x < 0 || p1.x > width) p1.vx *= -1;
            if (p1.y < 0 || p1.y > height) p1.vy *= -1;

            // Draw particle
            ctx.beginPath();
            ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
            ctx.fillStyle = p1.color + p1.alpha + ')';
            ctx.fill();

            // Connect near neighbors
            for (let j = i + 1; j < particles.length; j++) {
              const p2 = particles[j];
              const dx = p1.x - p2.x;
              const dy = p1.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 115) {
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(99, 102, 241, ${0.16 * (1 - dist / 115)})`;
                ctx.lineWidth = 0.75;
                ctx.stroke();
              }
            }

            // Connect to mouse pointer
            const mdx = p1.x - mouse.x;
            const mdy = p1.y - mouse.y;
            const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
            if (mdist < 140) {
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.strokeStyle = `rgba(6, 182, 212, ${0.4 * (1 - mdist / 140)})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="absolute inset-0 pointer-events-none z-0 opacity-75"
        />
      );
    }

    // Professional Animated Stat Counter Component
    function AnimatedStatCounter({ target, decimals = 0, suffix = '', duration = 1100 }) {
      const [value, setValue] = React.useState(0);

      React.useEffect(() => {
        const end = parseFloat(target);
        if (isNaN(end)) return;
        const startTime = performance.now();

        const update = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          // cubic ease out
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = end * eased;
          setValue(current);

          if (progress < 1) {
            requestAnimationFrame(update);
          } else {
            setValue(end);
          }
        };

        requestAnimationFrame(update);
      }, [target, duration]);

      return (
        <span>
          {value.toFixed(decimals)}{suffix}
        </span>
      );
    }

      // Bulk Question Parser Engine for 50-100+ MCQ / Subjective Questions
      const parseBulkQuestions = (rawText, courseId, unit, topic, defaultMarks, defaultNegative) => {
        if (!rawText || !rawText.trim()) return [];
        const cleanText = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const lines = cleanText.split('\n').map(l => l.trim()).filter(Boolean);
        const parsed = [];
        let currentQ = null;

        const isQuestionStart = (line) => /^(\d+[\.\)\-:]|Q\d+[\.\)\-:]|Question\s*\d+[\.\)\-:]|\([0-9]+\))\s+/i.test(line);
        const isOptionLine = (line) => /^([A-Da-d][\.\)\-:]|\([A-Da-d]\))\s+/i.test(line);
        const isAnswerLine = (line) => /^(Ans|Answer|Correct|Correct\s*Option|Key)[\s:\-]/i.test(line);
        const isMarksLine = (line) => /^(Marks|Mark|Points|Weightage)[\s:\-]/i.test(line);

        const finalizeCurrentQ = () => {
          if (!currentQ || !currentQ.questionText || !currentQ.questionText.trim()) return;
          const hasOptions = currentQ.options && currentQ.options.length >= 2;
          const finalType = hasOptions ? 'MCQ' : 'SUBJECTIVE';

          let finalOptions = null;
          let finalCorrectId = 'opt_1';

          if (hasOptions) {
            finalOptions = currentQ.options.map((optText, idx) => ({
              id: `opt_${idx + 1}`,
              text: optText
            }));

            if (currentQ.rawAnswer) {
              const ansMatch = currentQ.rawAnswer.match(/[A-Da-d]/);
              if (ansMatch) {
                const letter = ansMatch[0].toUpperCase();
                const map = { 'A': 'opt_1', 'B': 'opt_2', 'C': 'opt_3', 'D': 'opt_4' };
                finalCorrectId = map[letter] || 'opt_1';
              }
            }
          }

          parsed.push({
            id: `qb_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
            courseId: courseId || 'CS-302',
            unit: unit || 'Unit 1: Core Curriculum',
            topic: topic || 'Core Competency',
            type: finalType,
            marks: currentQ.marks || defaultMarks,
            negativeMarks: finalType === 'MCQ' ? defaultNegative : 0,
            questionText: currentQ.questionText.trim(),
            options: finalOptions,
            correctOptionId: finalCorrectId
          });

          currentQ = null;
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          // Tab / Pipe format support
          if (line.includes('|') && !isQuestionStart(line)) {
            const parts = line.split('|').map(p => p.trim());
            if (parts.length >= 2) {
              finalizeCurrentQ();
              const qText = parts[0];
              const isMcq = parts.length >= 5;
              if (isMcq) {
                parsed.push({
                  id: `qb_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
                  courseId: courseId || 'CS-302',
                  unit: unit || 'Unit 1: Core Curriculum',
                  topic: topic || 'Core Competency',
                  type: 'MCQ',
                  marks: parseFloat(parts[6]) || defaultMarks,
                  negativeMarks: defaultNegative,
                  questionText: qText,
                  options: [
                    { id: 'opt_1', text: parts[1] || 'Option A' },
                    { id: 'opt_2', text: parts[2] || 'Option B' },
                    { id: 'opt_3', text: parts[3] || 'Option C' },
                    { id: 'opt_4', text: parts[4] || 'Option D' }
                  ],
                  correctOptionId: (() => {
                    const ans = (parts[5] || 'A').toUpperCase();
                    return ans.includes('B') ? 'opt_2' : ans.includes('C') ? 'opt_3' : ans.includes('D') ? 'opt_4' : 'opt_1';
                  })()
                });
              } else {
                parsed.push({
                  id: `qb_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
                  courseId: courseId || 'CS-302',
                  unit: unit || 'Unit 1: Core Curriculum',
                  topic: topic || 'Core Competency',
                  type: 'SUBJECTIVE',
                  marks: parseFloat(parts[1]) || defaultMarks,
                  negativeMarks: 0,
                  questionText: qText,
                  options: null,
                  correctOptionId: null
                });
              }
              continue;
            }
          }

          if (isQuestionStart(line)) {
            finalizeCurrentQ();
            const cleanQText = line.replace(/^(\d+[\.\)\-:]|Q\d+[\.\)\-:]|Question\s*\d+[\.\)\-:]|\([0-9]+\))\s*/i, '').trim();
            currentQ = {
              questionText: cleanQText,
              options: [],
              rawAnswer: '',
              marks: defaultMarks
            };
          } else if (isOptionLine(line)) {
            if (!currentQ) {
              currentQ = { questionText: 'Question Item', options: [], rawAnswer: '', marks: defaultMarks };
            }
            const cleanOptText = line.replace(/^([A-Da-d][\.\)\-:]|\([A-Da-d]\))\s*/i, '').trim();
            currentQ.options.push(cleanOptText);
          } else if (isAnswerLine(line)) {
            if (currentQ) {
              currentQ.rawAnswer = line;
            }
          } else if (isMarksLine(line)) {
            if (currentQ) {
              const m = line.match(/\d+/);
              if (m) currentQ.marks = parseFloat(m[0]);
            }
          } else {
            if (currentQ) {
              if (currentQ.options.length === 0) {
                currentQ.questionText += ' ' + line;
              } else {
                currentQ.options[currentQ.options.length - 1] += ' ' + line;
              }
            } else {
              currentQ = {
                questionText: line,
                options: [],
                rawAnswer: '',
                marks: defaultMarks
              };
            }
          }
        }
        finalizeCurrentQ();
        return parsed;
      };

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("CredGen App Boundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">
              <div className="max-w-md w-full glass-panel p-8 rounded-2xl border border-rose-500/40 text-center space-y-4 shadow-2xl">
                <div className="w-14 h-14 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40 flex items-center justify-center mx-auto text-2xl">
                  [ALERT]
                </div>
                <h2 className="text-xl font-bold text-slate-100">Interface Recovered</h2>
                <p className="text-xs text-slate-400">
                  An interface transition issue was trapped. Click below to safely restore your dashboard.
                </p>
                <div className="text-[10px] font-mono text-rose-300 p-2.5 rounded bg-slate-900 border border-slate-800 text-left overflow-x-auto">
                  {this.state.error ? this.state.error.toString() : 'Unknown issue'}
                </div>
                <button
                  onClick={() => {
                    localStorage.removeItem('credgen_audit_sessions_v3');
                    window.location.reload();
                  }}
                  className="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold shadow-glow-brand"
                >
                  Safely Reload Application
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <CredGenApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
